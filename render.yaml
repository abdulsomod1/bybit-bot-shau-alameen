# ============================================================
# BYBIT P2P BOT — Render Blueprint
# Deploy the API server with embedded React frontend.
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. Go to https://render.com → Blueprints → New Blueprint Instance.
#   3. Connect your GitHub repo.
#   4. Set the required environment variables (see below).
# ============================================================
services:
  # ── API + FRONTEND ────────────────────────────────────────────
  # Express serves both the API and the built React frontend.
  # The React app is built first (npm run build), then Express starts.
  - name: bybit-p2p-api
    plan: starter
    region: oregon
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node dist/server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # ── Supabase ─────────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ── Encryption (64 hex chars = 32 bytes AES-256-GCM key) ──
      - key: RENDER_SERVICE_ENCRYPTION_KEY
        sync: false
      # ── Owner Access Token (REQUIRED) ─────────────────────────
      # Generate: node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
      # Set in Render dashboard. Keep this secret!
      - key: OWNER_ACCESS_TOKEN
        sync: false
      # ── Dev fallback token (optional, for local testing) ──────
      # Only used when NODE_ENV !== production
      - key: OWNER_ACCESS_TOKEN_DEV
        sync: false
      # ── Bot worker polling interval (ms) ─────────────────────
      - key: BOT_POLL_INTERVAL
        value: 60000

# NOTES:
# - The bot worker runs inside the Express server (bybit-p2p-api).
# - No separate Background Worker is needed since the polling loop
#   runs as a managed setInterval inside the Express process.
# - Render free tier: 750 hours/month. The API service will consume
#   ~720 hours if it runs continuously. Use the paid plan for reliability.
# - For production, use Render Starter ($7/month) or higher for always-on.
# - OWNER_ACCESS_TOKEN: REQUIRED. Without it, all API calls return 401.

